<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 213">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect width="160" height="213" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="30"  cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="75"  cy="12" r="1" fill="white" opacity="0.5"/>
  <circle cx="120" cy="25" r="1" fill="white" opacity="0.7"/>
  <circle cx="50"  cy="35" r="1" fill="white" opacity="0.4"/>
  <circle cx="140" cy="15" r="1" fill="white" opacity="0.6"/>
  <circle cx="15"  cy="50" r="1" fill="white" opacity="0.5"/>

  <!-- Left pipe (top) -->
  <rect x="10" y="0"  width="36" height="72" fill="url(#pipe)"/>
  <rect x="6"  y="58" width="44" height="14" rx="3" fill="#16a34a"/>

  <!-- Left pipe (bottom) -->
  <rect x="10" y="136" width="36" height="77" fill="url(#pipe)"/>
  <rect x="6"  y="136" width="44" height="14" rx="3" fill="#16a34a"/>

  <!-- Right pipe (top) -->
  <rect x="110" y="0"  width="36" height="52" fill="url(#pipe)"/>
  <rect x="106" y="38" width="44" height="14" rx="3" fill="#16a34a"/>

  <!-- Right pipe (bottom) -->
  <rect x="110" y="148" width="36" height="65" fill="url(#pipe)"/>
  <rect x="106" y="148" width="44" height="14" rx="3" fill="#16a34a"/>

  <!-- Bird body -->
  <ellipse cx="82" cy="100" rx="18" ry="14" fill="#facc15"/>
  <!-- Wing -->
  <ellipse cx="78" cy="108" rx="10" ry="6" fill="#fbbf24" transform="rotate(-20,78,108)"/>
  <!-- Belly -->
  <ellipse cx="87" cy="103" rx="9" ry="7" fill="#fef08a"/>
  <!-- Eye -->
  <circle cx="90" cy="95" r="5" fill="white"/>
  <circle cx="92" cy="95" r="3" fill="#1e293b"/>
  <circle cx="93" cy="94" r="1" fill="white"/>
  <!-- Beak -->
  <path d="M98 99 L110 101 L98 103 Z" fill="#f97316"/>

  <!-- Score -->
  <text x="80" y="175" font-family="system-ui,sans-serif" font-size="11" font-weight="700"
        fill="#facc15" text-anchor="middle" letter-spacing="1">FLAPPY BIRD</text>
  <text x="80" y="193" font-family="system-ui,sans-serif" font-size="10"
        fill="#713f12" text-anchor="middle" letter-spacing="1">ARCADE</text>
</svg>

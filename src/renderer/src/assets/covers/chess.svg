<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 213">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12101a"/>
      <stop offset="100%" stop-color="#0c0a14"/>
    </linearGradient>
  </defs>
  <rect width="160" height="213" fill="url(#bg)"/>

  <!-- Chess board (6x6, centered) -->
  <g transform="translate(20,28)">
    <!-- Board outline -->
    <rect x="0" y="0" width="120" height="120" rx="4" fill="#1e1a2e"/>
    <!-- Dark squares -->
    <rect x="0"  y="0"  width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="40" y="0"  width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="80" y="0"  width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="20" y="20" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="60" y="20" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="100" y="20" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="0"  y="40" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="40" y="40" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="80" y="40" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="20" y="60" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="60" y="60" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="100" y="60" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="0"  y="80" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="40" y="80" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="80" y="80" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="20" y="100" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="60" y="100" width="20" height="20" fill="#3730a3" opacity="0.7"/>
    <rect x="100" y="100" width="20" height="20" fill="#3730a3" opacity="0.7"/>

    <!-- White King (simplified) on e1 square (col4, row5) = x=80, y=100 -->
    <g transform="translate(80,100)" fill="#f0e6ff">
      <!-- Base -->
      <rect x="4" y="16" width="12" height="3" rx="1"/>
      <!-- Body -->
      <rect x="6" y="8" width="8" height="9" rx="1"/>
      <!-- Head -->
      <rect x="7" y="4" width="6" height="5" rx="2"/>
      <!-- Cross -->
      <rect x="9" y="1" width="2" height="5" rx="1"/>
      <rect x="7" y="3" width="6" height="2" rx="1"/>
    </g>

    <!-- Black Queen on d8 square (col3, row0) = x=60, y=0 -->
    <g transform="translate(60,0)" fill="#a78bfa">
      <!-- Base -->
      <rect x="4" y="16" width="12" height="3" rx="1"/>
      <!-- Body -->
      <rect x="5" y="8" width="10" height="9" rx="1"/>
      <!-- Crown -->
      <rect x="5" y="3" width="10" height="6" rx="1"/>
      <rect x="5"  y="1" width="2" height="5" rx="1"/>
      <rect x="9"  y="0" width="2" height="6" rx="1"/>
      <rect x="13" y="1" width="2" height="5" rx="1"/>
    </g>
  </g>

  <!-- Title -->
  <text x="80" y="178" font-family="system-ui,sans-serif" font-size="22" font-weight="700"
        fill="#a78bfa" text-anchor="middle" letter-spacing="2">CHESS</text>
  <text x="80" y="196" font-family="system-ui,sans-serif" font-size="10"
        fill="#4c1d95" text-anchor="middle" letter-spacing="1">STRATEGY</text>
</svg>
